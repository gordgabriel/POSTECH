apiVersion: v1
kind: Service
metadata:
  name: postech-db
spec:
  clusterIP: None
  selector:
    app: postech-db
  ports:
    - name: postgres
      port: 5432
      targetPort: postgres
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postech-db
spec:
  serviceName: postech-db
  replicas: 1
  selector:
    matchLabels:
      app: postech-db
  template:
    metadata:
      labels:
        app: postech-db
    spec:
      automountServiceAccountToken: false
      containers:
        - name: postgres
          image: postgres:16-alpine
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: postech
            - name: POSTGRES_USER
              value: postech_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: postech-secrets
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command: ["sh", "-c", "pg_isready -U postech_user -d postech"]
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
              ephemeral-storage: 256Mi
            limits:
              cpu: 1000m
              memory: 512Mi
              ephemeral-storage: 1Gi
  volumeClaimTemplates:
    - metadata:
        name: postgres-data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 1Gi