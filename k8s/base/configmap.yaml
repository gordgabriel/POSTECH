apiVersion: v1
kind: ConfigMap
metadata:
  name: postech-api-config
data:
  DEBUG: "False"
  ALLOWED_HOSTS: "*"
  DB_HOST: postech-db
  DB_NAME: postech
  DB_USER: postech_user
  DB_PORT: "5432"
  EMAIL_BACKEND: django.core.mail.backends.console.EmailBackend
  DEFAULT_FROM_EMAIL: oficina@localhost
  EMAIL_OPERACAO: operacao@localhost