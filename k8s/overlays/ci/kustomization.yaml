apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: postech
resources:
  - ../../base
images:
  - name: postech-api
    newTag: ci
patches:
  # A imagem é importada direto no nó do Kind pelo CI, não vem de registry.
  - target:
      kind: Deployment
      name: postech-api
    patch: |-
      - op: replace
        path: /spec/template/spec/containers/0/imagePullPolicy
        value: IfNotPresent
