name: Publish Image and Update GitOps

on:
  workflow_run:
    workflows: [CI Multistage Pipeline]
    types: [completed]
    branches: [main, master]

permissions:
  actions: read
  contents: write
  packages: write

concurrency:
  group: publish-image-${{ github.event.workflow_run.head_branch }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Publish Image for Argo CD
    runs-on: ubuntu-latest
    if: github.event.workflow_run.conclusion == 'success'
    env:
      IMAGE_TAG: ${{ github.event.workflow_run.head_sha || github.sha }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/postech
      TARGET_BRANCH: ${{ github.event.workflow_run.head_branch }}
    steps:
      - name: Check out source branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_branch }}

      - name: Download built image
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Load and validate image artifact
        run: |
          test -s postech-api.tar
          docker load --input postech-api.tar
          docker image inspect "postech-api:$IMAGE_TAG" > /dev/null
          echo "Docker image postech-api:$IMAGE_TAG validated."

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        run: |
          docker tag "postech-api:$IMAGE_TAG" "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update GitOps image tag
        run: |
          if [ "$(git rev-parse HEAD)" != "$IMAGE_TAG" ]; then
            echo "A newer commit is already on $TARGET_BRANCH; skipping this stale image update."
            exit 0
          fi

          sed -i "s/^  newTag: .*/  newTag: $IMAGE_TAG/" k8s/overlays/kind/kustomization.yaml
          if git diff --quiet -- k8s/overlays/kind/kustomization.yaml; then
            echo "GitOps image tag is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/kind/kustomization.yaml
          git commit -m "chore(gitops): deploy $IMAGE_TAG"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Deployment summary
        if: success()
        run: |
          {
            echo "## Image published for Argo CD"
            echo ""
            echo "- Image: $IMAGE_NAME:$IMAGE_TAG"
            echo "- GitOps path: k8s/overlays/kind"
            echo "- Cluster rollout: managed by Argo CD"
          } >> "$GITHUB_STEP_SUMMARY"