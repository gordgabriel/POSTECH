name: CI Multistage Pipeline

on:
  push:
    branches: [main, master]
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: '3.11'

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

  lint:
    name: Django Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanner
        run: python -m pip install pip-audit

      # Django 4.2 is retained for compatibility; these findings have no fix listed for this release line.
      - name: Audit dependencies (accepted Django 4.2 advisories)
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-198 \
            --ignore-vuln PYSEC-2026-199 \
            --ignore-vuln PYSEC-2026-201 \
            --ignore-vuln PYSEC-2026-2090 \
            --ignore-vuln PYSEC-2026-2091 \
            --ignore-vuln PYSEC-2026-2092 \
            --ignore-vuln PYSEC-2026-3717 \
            --ignore-vuln PYSEC-2026-4035

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, sonar, lint, security]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag postech-api:${{ github.sha }} .

      - name: Save image artifact
        run: docker save postech-api:${{ github.sha }} --output postech-api.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: postech-api.tar
          retention-days: 7

