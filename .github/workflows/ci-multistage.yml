name: CI/CD Pipeline

on:
  push:
    branches: [main]
    paths-ignore:
      - "k8s/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-cd-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Run Tests
    uses: ./.github/workflows/reusable-test.yml
    with:
      python-version: '3.11'

  sonar:
    name: SonarCloud Scan
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download coverage report
        uses: actions/download-artifact@v4
        with:
          name: coverage-report

      - name: SonarCloud Scan
        uses: SonarSource/sonarqube-scan-action@7006c4492b2e0ee0f816d36501671557c97f5995
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.python.coverage.reportPaths=coverage.xml

  lint:
    name: Django Checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Django system checks
        run: python manage.py check

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install security scanner
        run: python -m pip install pip-audit

      # Django 4.2 is retained for compatibility; these findings have no fix listed for this release line.
      - name: Audit dependencies (accepted Django 4.2 advisories)
        run: |
          pip-audit --requirement requirements.txt \
            --ignore-vuln PYSEC-2026-198 \
            --ignore-vuln PYSEC-2026-199 \
            --ignore-vuln PYSEC-2026-201 \
            --ignore-vuln PYSEC-2026-2090 \
            --ignore-vuln PYSEC-2026-2091 \
            --ignore-vuln PYSEC-2026-2092 \
            --ignore-vuln PYSEC-2026-3717 \
            --ignore-vuln PYSEC-2026-4035

  terraform_validate:
    name: Terraform Modules Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4

      - name: Validate Terraform modules without AWS
        shell: bash
        run: |
          set -euo pipefail
          for module in terraform/modules/*/; do
            echo "Validating $module"
            terraform -chdir="$module" init -backend=false -input=false
            terraform -chdir="$module" validate
          done

          terraform -chdir=terraform/environments/modules init -backend=false -input=false
          terraform -chdir=terraform/environments/modules validate

          {
            echo "Terraform validation passed."
            echo "No AWS credentials, plan, or apply were used."
          } > "$RUNNER_TEMP/terraform-simulation.txt"

      - name: Upload Terraform simulation report
        uses: actions/upload-artifact@v4
        with:
          name: terraform-modules-simulation
          path: ${{ runner.temp }}/terraform-simulation.txt
          retention-days: 7

  build:
    name: Build Docker Image
    runs-on: ubuntu-latest
    needs: [test, sonar, lint, security, terraform_validate]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build image
        run: docker build --tag postech-api:${{ github.sha }} .

      - name: Save image artifact
        run: docker save postech-api:${{ github.sha }} --output postech-api.tar

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: postech-api.tar
          retention-days: 7

  deploy:
    name: Publish Image and Update GitOps
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main'
    permissions:
      contents: write
      packages: write
    env:
      IMAGE_TAG: ${{ github.sha }}
      IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/postech
      TARGET_BRANCH: main
    steps:
      - name: Check out latest main
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Check whether this run is current
        id: current
        run: |
          if [ "$(git rev-parse HEAD)" = "$IMAGE_TAG" ]; then
            echo "is_current=true" >> "$GITHUB_OUTPUT"
          else
            echo "is_current=false" >> "$GITHUB_OUTPUT"
            echo "A newer commit is already on main; deployment will be skipped."
          fi

      - name: Download built image
        if: steps.current.outputs.is_current == 'true'
        uses: actions/download-artifact@v4
        with:
          name: build-artifacts

      - name: Load and validate image artifact
        if: steps.current.outputs.is_current == 'true'
        run: |
          test -s postech-api.tar
          docker load --input postech-api.tar
          docker image inspect "postech-api:$IMAGE_TAG" > /dev/null

      - name: Log in to GitHub Container Registry
        if: steps.current.outputs.is_current == 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish image
        if: steps.current.outputs.is_current == 'true'
        run: |
          docker tag "postech-api:$IMAGE_TAG" "$IMAGE_NAME:$IMAGE_TAG"
          docker push "$IMAGE_NAME:$IMAGE_TAG"

      - name: Update GitOps image tag
        if: steps.current.outputs.is_current == 'true'
        run: |
          sed -i "s/^  newTag: .*/  newTag: $IMAGE_TAG/" k8s/overlays/kind/kustomization.yaml
          if git diff --quiet -- k8s/overlays/kind/kustomization.yaml; then
            echo "GitOps image tag is already up to date."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add k8s/overlays/kind/kustomization.yaml
          git commit -m "chore(gitops): deploy $IMAGE_TAG"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Deployment summary
        if: always()
        env:
          IS_CURRENT: ${{ steps.current.outputs.is_current }}
        run: |
          {
            echo "## CI/CD Deployment"
            echo ""
            if [ "$IS_CURRENT" = "true" ]; then
              echo "- Image: $IMAGE_NAME:$IMAGE_TAG"
              echo "- GitOps path: k8s/overlays/kind"
              echo "- Cluster rollout: managed by Argo CD"
            else
              echo "- Deployment skipped because a newer commit is on main."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

