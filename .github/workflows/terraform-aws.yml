name: Terraform AWS (EKS + RDS)

on:
  workflow_dispatch:
    inputs:
      operation:
        description: "Plan only, or plan and apply after environment approval"
        required: true
        type: choice
        options:
          - plan
          - apply
        default: plan

permissions:
  contents: read

concurrency:
  group: terraform-aws-k8s
  cancel-in-progress: false

jobs:
  plan:
    name: Plan AWS infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Require main branch
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "::error::Run this workflow from the main branch."
            exit 1
          fi

      - name: Validate GitHub configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          EKS_ADMIN_CIDR_JSON: ${{ secrets.EKS_ADMIN_CIDR_JSON }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_AWS_ACCOUNT_ID"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          test -n "$EKS_ADMIN_CIDR_JSON"
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$") and . != "0.0.0.0/0")' \
            <<< "$EKS_ADMIN_CIDR_JSON" > /dev/null
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED_AWS_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_region=$AWS_REGION" >> "$GITHUB_ENV"
          echo "TF_VAR_cluster_endpoint_public_access_cidrs=$EKS_ADMIN_CIDR_JSON" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=postech/aws-k8s/terraform.tfstate" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS account and bootstrap Terraform state bucket
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]; then
            echo "::error::The active AWS credentials do not match AWS_ACCOUNT_ID."
            exit 1
          fi

          bucket="postech-tfstate-${EXPECTED_AWS_ACCOUNT_ID}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api get-bucket-location --bucket "$bucket" >/dev/null
          aws s3api put-public-access-block \
            --bucket "$bucket" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning \
            --bucket "$bucket" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Initialize Terraform with remote state
        working-directory: infra/terraform/environments/aws-k8s
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Validate Terraform
        working-directory: infra/terraform/environments/aws-k8s
        run: |
          terraform fmt -check -recursive
          terraform validate

      - name: Create Terraform plan
        working-directory: infra/terraform/environments/aws-k8s
        run: terraform plan -input=false -no-color

  apply:
    name: Apply AWS infrastructure
    if: ${{ inputs.operation == 'apply' }}
    needs: plan
    runs-on: ubuntu-latest
    environment: aws-lab
    permissions:
      contents: read
    steps:
      - name: Validate GitHub configuration
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
          AWS_REGION: ${{ secrets.AWS_REGION }}
          EXPECTED_AWS_ACCOUNT_ID: ${{ secrets.AWS_ACCOUNT_ID }}
          EKS_ADMIN_CIDR_JSON: ${{ secrets.EKS_ADMIN_CIDR_JSON }}
        run: |
          set -euo pipefail
          test -n "$EXPECTED_AWS_ACCOUNT_ID"
          test -n "$AWS_REGION"
          test -n "$AWS_ACCESS_KEY_ID"
          test -n "$AWS_SECRET_ACCESS_KEY"
          test -n "$AWS_SESSION_TOKEN"
          test -n "$EKS_ADMIN_CIDR_JSON"
          jq -e 'type == "array" and length > 0 and all(.[]; type == "string" and test("^([0-9]{1,3}\\.){3}[0-9]{1,3}/([0-9]|[12][0-9]|3[0-2])$") and . != "0.0.0.0/0")' \
            <<< "$EKS_ADMIN_CIDR_JSON" > /dev/null
          echo "AWS_REGION=$AWS_REGION" >> "$GITHUB_ENV"
          echo "EXPECTED_AWS_ACCOUNT_ID=$EXPECTED_AWS_ACCOUNT_ID" >> "$GITHUB_ENV"
          echo "TF_VAR_aws_region=$AWS_REGION" >> "$GITHUB_ENV"
          echo "TF_VAR_cluster_endpoint_public_access_cidrs=$EKS_ADMIN_CIDR_JSON" >> "$GITHUB_ENV"
          echo "TF_STATE_KEY=postech/aws-k8s/terraform.tfstate" >> "$GITHUB_ENV"

      - name: Check out repository
        uses: actions/checkout@v4

      - name: Configure temporary AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-session-token: ${{ secrets.AWS_SESSION_TOKEN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Verify AWS account and bootstrap Terraform state bucket
        run: |
          set -euo pipefail
          actual_account_id="$(aws sts get-caller-identity --query Account --output text)"
          if [ "$actual_account_id" != "$EXPECTED_AWS_ACCOUNT_ID" ]; then
            echo "::error::The active AWS credentials do not match AWS_ACCOUNT_ID."
            exit 1
          fi

          bucket="postech-tfstate-${EXPECTED_AWS_ACCOUNT_ID}-${AWS_REGION}"
          if ! aws s3api head-bucket --bucket "$bucket" >/dev/null 2>&1; then
            if [ "$AWS_REGION" = "us-east-1" ]; then
              aws s3api create-bucket --bucket "$bucket" --region "$AWS_REGION"
            else
              aws s3api create-bucket \
                --bucket "$bucket" \
                --region "$AWS_REGION" \
                --create-bucket-configuration "LocationConstraint=$AWS_REGION"
            fi
          fi

          aws s3api get-bucket-location --bucket "$bucket" >/dev/null
          aws s3api put-public-access-block \
            --bucket "$bucket" \
            --public-access-block-configuration \
            BlockPublicAcls=true,IgnorePublicAcls=true,BlockPublicPolicy=true,RestrictPublicBuckets=true
          aws s3api put-bucket-versioning \
            --bucket "$bucket" \
            --versioning-configuration Status=Enabled
          aws s3api put-bucket-encryption \
            --bucket "$bucket" \
            --server-side-encryption-configuration \
            '{"Rules":[{"ApplyServerSideEncryptionByDefault":{"SSEAlgorithm":"AES256"}}]}'
          echo "TF_STATE_BUCKET=$bucket" >> "$GITHUB_ENV"

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.13.4
          terraform_wrapper: false

      - name: Initialize Terraform with remote state
        working-directory: infra/terraform/environments/aws-k8s
        run: |
          terraform init -input=false \
            -backend-config="bucket=$TF_STATE_BUCKET" \
            -backend-config="key=$TF_STATE_KEY" \
            -backend-config="region=$AWS_REGION" \
            -backend-config="encrypt=true" \
            -backend-config="use_lockfile=true"

      - name: Apply reviewed configuration
        working-directory: infra/terraform/environments/aws-k8s
        run: |
          terraform plan -input=false -out=tfplan
          terraform apply -input=false -auto-approve tfplan
